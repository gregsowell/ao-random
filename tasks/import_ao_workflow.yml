---
# Import (or update) one workflow JSON file into automation orchestrator.
# Input:   workflow ({url | file, name?, description?})
#          file is relative to the playbook directory and wins over url.
# Output:  appends to _ao_loaded_workflows
- name: Download {{ workflow.url | default('') | basename }}
  ansible.builtin.uri:
    url: "{{ workflow.url }}"
    return_content: true
  register: _wf_download
  when: workflow.file is not defined

- name: Parse {{ workflow.file | default(workflow.url) | basename }}
  ansible.builtin.set_fact:
    _wf_source: >-
      {{ (lookup('ansible.builtin.file', playbook_dir ~ '/' ~ workflow.file)
          if workflow.file is defined else _wf_download.content) | from_json }}
    _wf_nodes: []

# Exported files carry credential and integration IDs from the source
# instance (or a placeholder). AAP execution nodes need both: the
# integration resolves the AAP URL and the credential authenticates.
# Template IDs are also specific to the source AAP, so when a step names
# its template, the ID is dropped and the step resolves by name.
- name: Attach the demo AAP integration and credential to AAP nodes
  vars:
    _params: "{{ node.parameters | default({}) }}"
    _drop: >-
      {{ (['job_template_id'] if _params.job_template_name is defined else [])
         + (['workflow_job_template_id'] if _params.workflow_job_template_name is defined else []) }}
    _aap_params: >-
      {{ _params | dict2items | rejectattr('key', 'in', _drop) | items2dict
         | combine({'credential_id': _ao_cred_id, 'integration_id': _ao_integration_id}) }}
  ansible.builtin.set_fact:
    _wf_nodes: >-
      {{ _wf_nodes + [
           node | combine({'parameters': _aap_params})
           if node.type in ao_aap_node_types else node
         ] }}
  loop: "{{ _wf_source.nodes | default([]) }}"
  loop_control:
    loop_var: node
    label: "{{ node.name | default(node.id) }}"

- name: Build the workflow definition
  vars:
    _name: "{{ workflow.name | default(_wf_source.name) }}"
  ansible.builtin.set_fact:
    _wf_definition: >-
      {{ _wf_source | combine({
           'schema_version': _wf_source.schema_version | default('2.0.0'),
           'name': _name,
           'description': workflow.description | default(_wf_source.description | default(_name)),
           'nodes': _wf_nodes
         }) }}

- name: List existing workflows
  ansible.builtin.uri:
    url: "{{ _ao_api }}/workflows?limit=100"
    headers: "{{ _ao_headers }}"
    validate_certs: "{{ ao_validate_certs }}"
  register: _wf_list

- name: Check for an existing {{ _wf_definition.name }} workflow
  ansible.builtin.set_fact:
    _wf_existing: >-
      {{ _wf_list.json.resources
         | selectattr('name', 'equalto', _wf_definition.name)
         | first | default({}) }}

- name: Import workflow {{ _wf_definition.name }}
  ansible.builtin.uri:
    url: "{{ _ao_api }}/workflows"
    method: POST
    headers: "{{ _ao_headers }}"
    body_format: json
    body:
      name: "{{ _wf_definition.name }}"
      description: "{{ _wf_definition.description }}"
      project_id: "{{ _ao_project.id }}"
      is_import: true
      workflow_definition: "{{ _wf_definition }}"
    validate_certs: "{{ ao_validate_certs }}"
    status_code: [200, 201]
  register: _wf_created
  when: not _wf_existing

# PATCH creates a new draft version when the definition changed.
- name: Update workflow {{ _wf_definition.name }}
  ansible.builtin.uri:
    url: "{{ _ao_api }}/workflows/{{ _wf_existing.id }}"
    method: PATCH
    headers: "{{ _ao_headers }}"
    body_format: json
    body:
      workflow_definition: "{{ _wf_definition }}"
    validate_certs: "{{ ao_validate_certs }}"
    status_code: 200
  register: _wf_updated
  when: _wf_existing | length > 0

- name: Remember the workflow ID
  ansible.builtin.set_fact:
    _wf_id: "{{ _wf_existing.id if _wf_existing else _wf_created.json.id }}"
    _wf_status: "{{ 'updated' if _wf_existing else 'imported' }}"

# Publishing fails validation until the referenced AAP job templates,
# LLM, and MCP integrations exist, so a failure here only warns.
- name: Publish workflow {{ _wf_definition.name }}
  when: ao_publish_workflows | bool
  block:
    - name: List versions of {{ _wf_definition.name }}
      ansible.builtin.uri:
        url: "{{ _ao_api }}/workflows/{{ _wf_id }}/versions?limit=100"
        headers: "{{ _ao_headers }}"
        validate_certs: "{{ ao_validate_certs }}"
      register: _wf_versions

    - name: Publish the latest version of {{ _wf_definition.name }}
      ansible.builtin.uri:
        url: "{{ _ao_api }}/workflows/{{ _wf_id }}/versions/{{ _wf_versions.json.resources | map(attribute='version') | max }}/publish"
        method: POST
        headers: "{{ _ao_headers }}"
        body_format: json
        body:
          publish_name: Loaded by ao_setup.yml
        validate_certs: "{{ ao_validate_certs }}"
        status_code: [200, 201]

    - name: Record the publish
      ansible.builtin.set_fact:
        _wf_status: "{{ _wf_status }} and published"
  rescue:
    - name: Warn that {{ _wf_definition.name }} was not published
      ansible.builtin.debug:
        msg: >-
          {{ _wf_definition.name }} was saved as a draft but not published:
          {{ ansible_failed_result.json | default(ansible_failed_result.msg) }}

- name: Record {{ _wf_definition.name }}
  ansible.builtin.set_fact:
    _ao_loaded_workflows: >-
      {{ _ao_loaded_workflows | default([])
         + ['Workflow: ' ~ _wf_definition.name ~ ' (' ~ _wf_id ~ ') ' ~ _wf_status] }}
