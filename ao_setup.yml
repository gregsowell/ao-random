---
# Provision automation orchestrator (AO) through a Red Hat Demo Platform AAP
# instance, then load base configuration into AO.
#
# Required extra vars:
#   demo_aap_url       URL of the demo AAP instance
#   demo_aap_password  admin password for the demo AAP instance
- name: Provision and configure automation orchestrator
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # --- Demo AAP ---------------------------------------------------------
    demo_aap_username: admin
    demo_aap_validate_certs: false

    apd_setup_template: "APD | Single demo setup"
    apd_setup_demo: infrastructure
    ao_install_template: "Infrastructure | Automation Orchestrator | Install"
    ao_access_task: "Display access information"

    # Set either to false on a rerun to skip that stage. With run_ao_install
    # false, access details come from the last successful install job.
    run_apd_setup: true
    run_ao_install: true

    # 30s x 240 = up to 2 hours per job
    aap_job_poll_delay: 30
    aap_job_poll_retries: 240

    # --- Automation orchestrator -----------------------------------------
    ao_validate_certs: false
    ao_login_retries: 20
    ao_login_delay: 15
    ao_project_name: Default
    ao_aap_credential_name: Demo AAP
    ao_aap_credential_verify_ssl: "{{ demo_aap_validate_certs }}"
    ao_aap_node_types:
      - aap_job_template
      - aap_workflow_template
    ao_publish_workflows: false
    show_ao_password: false

    ao_workflows:
      - name: Disk Utilization Demo 101
        url: https://raw.githubusercontent.com/ansible-tmm/aap-orchestrator-demos/main/disk-utilization/ao/disk-demo-101.json
      - name: RHEL CVE Remediation - Intelligent Patching
        url: https://raw.githubusercontent.com/ansible-tmm/aap-orchestrator-demos/main/cve-remediation/ao/rhel-cve-remediation.json

  tasks:
    - name: Verify required variables were supplied
      ansible.builtin.assert:
        that:
          - demo_aap_url | default('') | trim | length > 0
          - demo_aap_password | default('') | length > 0
        fail_msg: Supply demo_aap_url and demo_aap_password at run time.
        quiet: true

    # ======================================================================
    # Demo AAP: run the APD setup and the AO install
    # ======================================================================
    - name: Normalize the demo AAP URL
      vars:
        _raw_url: "{{ demo_aap_url | trim }}"
        _full_url: "{{ _raw_url if '://' in _raw_url else 'https://' ~ _raw_url }}"
      ansible.builtin.set_fact:
        _aap_base: "{{ _full_url | ansible.builtin.urlsplit('scheme') }}://{{ _full_url | ansible.builtin.urlsplit('netloc') }}"

    - name: Detect the automation controller API path
      ansible.builtin.uri:
        url: "{{ _aap_base }}/api/controller/v2/ping/"
        validate_certs: "{{ demo_aap_validate_certs }}"
        status_code: [200, 404]
      register: _aap_ping

    - name: Set the automation controller API base
      ansible.builtin.set_fact:
        _aap_api: "{{ _aap_base }}{{ '/api/controller/v2' if _aap_ping.status == 200 else '/api/v2' }}"

    - name: Run {{ apd_setup_template }} with demo={{ apd_setup_demo }}
      ansible.builtin.include_tasks: tasks/run_aap_job.yml
      vars:
        _jt_name: "{{ apd_setup_template }}"
        _jt_extra_vars:
          demo: "{{ apd_setup_demo }}"
      when: run_apd_setup | bool

    - name: Run {{ ao_install_template }}
      ansible.builtin.include_tasks: tasks/run_aap_job.yml
      vars:
        _jt_name: "{{ ao_install_template }}"
        _jt_extra_vars: {}
      when: run_ao_install | bool

    - name: Use the last successful install job
      when: not (run_ao_install | bool)
      block:
        - name: Look up job template {{ ao_install_template }}
          ansible.builtin.uri:
            url: "{{ _aap_api }}/job_templates/?name={{ ao_install_template | urlencode }}"
            user: "{{ demo_aap_username }}"
            password: "{{ demo_aap_password }}"
            force_basic_auth: true
            validate_certs: "{{ demo_aap_validate_certs }}"
          register: _install_jt

        - name: Look up the last successful install job
          ansible.builtin.uri:
            url: "{{ _aap_api }}/job_templates/{{ _install_jt.json.results[0].id }}/jobs/?status=successful&order_by=-finished&page_size=1"
            user: "{{ demo_aap_username }}"
            password: "{{ demo_aap_password }}"
            force_basic_auth: true
            validate_certs: "{{ demo_aap_validate_certs }}"
          register: _install_jobs
          when: _install_jt.json.count | default(0) == 1

        - name: Verify a successful install job exists
          ansible.builtin.assert:
            that:
              - _install_jobs.json.results | default([]) | length > 0
            fail_msg: >-
              No successful '{{ ao_install_template }}' job found on {{ _aap_base }}.
              Rerun with run_ao_install=true.
            quiet: true

        - name: Remember the install job
          ansible.builtin.set_fact:
            _aap_job: "{{ _install_jobs.json.results[0] }}"

    - name: Read the access information from install job {{ _aap_job.id }}
      ansible.builtin.uri:
        url: "{{ _aap_api }}/jobs/{{ _aap_job.id }}/job_events/?event=runner_on_ok&task={{ ao_access_task | urlencode }}&order_by=-counter&page_size=1"
        user: "{{ demo_aap_username }}"
        password: "{{ demo_aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ demo_aap_validate_certs }}"
      register: _access_events
      no_log: true

    - name: Parse the automation orchestrator connection details
      vars:
        _lines: "{{ _access_events.json.results | map(attribute='event_data') | map(attribute='res') | map(attribute='msg') | first | default([]) }}"
      ansible.builtin.set_fact:
        ao_url: "{{ _lines | select('match', 'URL:') | first | default('') | regex_replace('^URL: *', '') | trim | regex_replace('/+$', '') }}"
        ao_username: "{{ _lines | select('match', 'Username:') | first | default('') | regex_replace('^Username: *', '') | trim }}"
        ao_password: "{{ _lines | select('match', 'Password:') | first | default('') | regex_replace('^Password: *', '') | trim }}"
      no_log: true

    - name: Verify the connection details were found
      ansible.builtin.assert:
        that:
          - ao_url | length > 0
          - ao_username | length > 0
          - ao_password | length > 0
        fail_msg: >-
          Could not parse URL, username, and password from the '{{ ao_access_task }}'
          task in job {{ _aap_job.id }} ({{ _aap_base }}/execution/jobs/playbook/{{ _aap_job.id }}/output).
        quiet: true

    - name: Show the automation orchestrator URL
      ansible.builtin.debug:
        msg: "Automation orchestrator: {{ ao_url }} (user {{ ao_username }})"

    # ======================================================================
    # Automation orchestrator: base configuration
    # ======================================================================
    - name: Set the automation orchestrator API base
      ansible.builtin.set_fact:
        _ao_api: "{{ ao_url }}/api/v1"

    # AO can reject logins for a minute or two after a fresh deploy.
    - name: Log in to automation orchestrator
      ansible.builtin.uri:
        url: "{{ _ao_api }}/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ ao_username }}"
          password: "{{ ao_password }}"
        validate_certs: "{{ ao_validate_certs }}"
        status_code: 200
      register: _ao_login
      until: _ao_login.status == 200
      retries: "{{ ao_login_retries }}"
      delay: "{{ ao_login_delay }}"
      no_log: true

    - name: Set the automation orchestrator auth header
      ansible.builtin.set_fact:
        _ao_headers:
          Authorization: "Bearer {{ _ao_login.json.access_token }}"
      no_log: true

    - name: List automation orchestrator projects
      ansible.builtin.uri:
        url: "{{ _ao_api }}/projects?limit=100"
        headers: "{{ _ao_headers }}"
        validate_certs: "{{ ao_validate_certs }}"
      register: _ao_projects

    - name: Select project {{ ao_project_name }}
      ansible.builtin.set_fact:
        _ao_project: >-
          {{ _ao_projects.json.resources
             | selectattr('name', 'match', '(?i)^' ~ (ao_project_name | regex_escape) ~ '$')
             | first | default({}) }}

    - name: Verify the project exists
      ansible.builtin.assert:
        that:
          - _ao_project | length > 0
        fail_msg: >-
          Project '{{ ao_project_name }}' not found. Available projects:
          {{ _ao_projects.json.resources | map(attribute='name') | join(', ') }}
        quiet: true

    - name: List credential types
      ansible.builtin.uri:
        url: "{{ _ao_api }}/credential_types?limit=100"
        headers: "{{ _ao_headers }}"
        validate_certs: "{{ ao_validate_certs }}"
      register: _ao_cred_types

    - name: Select the Ansible Automation Platform credential type
      ansible.builtin.set_fact:
        _ao_cred_type_id: >-
          {{ _ao_cred_types.json.resources
             | selectattr('name', 'search', '(?i)ansible automation platform')
             | map(attribute='id') | first | default('') }}

    - name: Verify the credential type exists
      ansible.builtin.assert:
        that:
          - _ao_cred_type_id | length > 0
        fail_msg: >-
          No Ansible Automation Platform credential type found. Available types:
          {{ _ao_cred_types.json.resources | map(attribute='name') | join(', ') }}
        quiet: true

    - name: Read the credential type field schema
      ansible.builtin.uri:
        url: "{{ _ao_api }}/credential_types/{{ _ao_cred_type_id }}"
        headers: "{{ _ao_headers }}"
        validate_certs: "{{ ao_validate_certs }}"
      register: _ao_cred_type

    # Map our values onto the type's field IDs so this does not depend on
    # exact key names. Set ao_aap_credential_inputs to bypass the mapping.
    - name: Build the AAP credential inputs
      vars:
        _inputs: "{{ _ao_cred_type.json.inputs | default({}) }}"
        _fields: "{{ (_inputs.fields | map(attribute='id') | list) if _inputs.fields is defined else (_inputs.properties | default({}) | list) }}"
      ansible.builtin.set_fact:
        _ao_cred_fields: "{{ _fields }}"
        _ao_cred_inputs: >-
          {{ ao_aap_credential_inputs | default({
               (_fields | select('search', '(?i)host|url') | first | default('host')): _aap_base,
               (_fields | select('search', '(?i)user') | first | default('username')): demo_aap_username,
               (_fields | select('search', '(?i)passw') | first | default('password')): demo_aap_password,
               (_fields | select('search', '(?i)verify|ssl') | first | default('verify_ssl')): ao_aap_credential_verify_ssl | bool
             }, true) }}
      no_log: true

    - name: Show the credential type fields
      ansible.builtin.debug:
        msg: "AAP credential type fields: {{ _ao_cred_fields | join(', ') }}"

    - name: List credentials
      ansible.builtin.uri:
        url: "{{ _ao_api }}/credentials?limit=100"
        headers: "{{ _ao_headers }}"
        validate_certs: "{{ ao_validate_certs }}"
      register: _ao_creds

    - name: Check for an existing {{ ao_aap_credential_name }} credential
      ansible.builtin.set_fact:
        _ao_cred_existing: >-
          {{ _ao_creds.json.resources
             | selectattr('name', 'equalto', ao_aap_credential_name)
             | first | default({}) }}

    # The request body carries the AAP password, so the task runs with
    # no_log and the next task reports the (secret-masked) response.
    - name: Create or update the {{ ao_aap_credential_name }} credential
      ansible.builtin.uri:
        url: "{{ _ao_api }}/credentials{{ ('/' ~ _ao_cred_existing.id) if _ao_cred_existing else '' }}"
        method: "{{ 'PATCH' if _ao_cred_existing else 'POST' }}"
        headers: "{{ _ao_headers }}"
        body_format: json
        body: >-
          {{ {'inputs': _ao_cred_inputs} if _ao_cred_existing else {
               'name': ao_aap_credential_name,
               'description': 'Demo AAP instance ' ~ _aap_base,
               'project_id': _ao_project.id,
               'credential_type_id': _ao_cred_type_id,
               'inputs': _ao_cred_inputs
             } }}
        validate_certs: "{{ ao_validate_certs }}"
        status_code: [200, 201]
      register: _ao_cred_result
      failed_when: false
      no_log: true

    - name: Verify the credential was saved
      ansible.builtin.assert:
        that:
          - _ao_cred_result.status in [200, 201]
        fail_msg: >-
          Credential save failed (HTTP {{ _ao_cred_result.status }}):
          {{ _ao_cred_result.json | default(_ao_cred_result.msg) }}
        quiet: true

    - name: Remember the credential ID
      ansible.builtin.set_fact:
        _ao_cred_id: "{{ _ao_cred_result.json.id | default(_ao_cred_existing.id) }}"

    - name: Load workflows
      ansible.builtin.include_tasks: tasks/import_ao_workflow.yml
      loop: "{{ ao_workflows }}"
      loop_control:
        loop_var: workflow
        label: "{{ workflow.name | default(workflow.url) }}"

    - name: Summary
      ansible.builtin.debug:
        msg: "{{ _summary + (_ao_loaded_workflows | default([])) }}"
      vars:
        _summary:
          - "Automation orchestrator: {{ ao_url }}"
          - "Username: {{ ao_username }}"
          - "Password: {{ ao_password if show_ao_password | bool else 'see the ' ~ ao_access_task ~ ' task in ' ~ _aap_base ~ '/execution/jobs/playbook/' ~ _aap_job.id ~ '/output' }}"
          - "Credential: {{ ao_aap_credential_name }} ({{ _ao_cred_id }}) in project {{ _ao_project.name }}"
